services:
  workbench:
    build: .
    image: gencyber-workbench
    container_name: gencyber-workbench
    ports:
      - "8080:80"
      - "3000:3000"
    volumes:
      - workbench_workspace:/workspace
    environment:
      CHALLENGE_ROOT: /workspace/challenges
      PORT: "3000"
    networks:
      - generative-cybersecurity-network

networks:
  generative-cybersecurity-network:
    external: true

volumes:
  workbench_workspace:
